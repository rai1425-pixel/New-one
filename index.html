<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>⚡ Reaction Time</h1>
        <p id="message">Press START to begin</p>

        <button id="gameButton">START</button>

        <div class="stats">
            <div>
                <span>Last</span>
                <strong id="last">—</strong>
            </div>

            <div>
                <span>Best</span>
                <strong id="best">—</strong>
            </div>

            <div>
                <span>Average</span>
                <strong id="average">—</strong>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
